<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" role="img"
     aria-label="TruckScore credit flow: FASTag, GPS and fuel-card data flow into an approval hub, producing a loan approval and an insurance discount, with a TruckScore of 782" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- background -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf6e9"/>
      <stop offset=".55" stop-color="#f3e2c6"/>
      <stop offset="1" stop-color="#e8c8a4"/>
    </linearGradient>
    <pattern id="dotGrid" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r=".7" fill="#a88b6a" fill-opacity=".28"/>
    </pattern>

    <!-- card shadow -->
    <filter id="cardShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#6b4a2a" flood-opacity=".3"/>
    </filter>

    <!-- approval badge -->
    <radialGradient id="badgeGrad" cx=".4" cy=".35" r=".75">
      <stop offset="0" stop-color="#25a85d"/>
      <stop offset="1" stop-color="#11743b"/>
    </radialGradient>

    <!-- connector paths -->
    <path id="flow1" d="M156 84 Q 205 88 234 142"/>
    <path id="flow2" d="M156 159.5 L 226 159.5"/>
    <path id="flow3" d="M156 235 Q 205 230 234 177"/>

    <!-- TruckScore gradient (unchanged red → gold → green) -->
    <linearGradient id="gaugeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#e44f29"/>
      <stop offset=".3"  stop-color="#d9782c"/>
      <stop offset=".55" stop-color="#cc9a2e"/>
      <stop offset=".8"  stop-color="#6f9944"/>
      <stop offset="1"   stop-color="#2a8f4e"/>
    </linearGradient>

    <!-- NEW: TruckScore halo (static) -->
    <linearGradient id="gaugeHaloGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#f0a238"/>
      <stop offset=".6"  stop-color="#f2b443"/>
      <stop offset=".85" stop-color="#9cc45a"/>
      <stop offset="1"   stop-color="#3fae66"/>
    </linearGradient>
    <filter id="gaugeHaloBlur" x="-10%" y="-200%" width="120%" height="500%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <!-- tight edge glow: concentrates light along the top and bottom edges -->
    <filter id="gaugeEdgeGlow" x="-5%" y="-150%" width="110%" height="400%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="500" height="400" fill="url(#bgGrad)"/>
  <rect width="500" height="400" fill="url(#dotGrid)"/>

  <!-- connectors: dashed data-flow lines -->
  <g fill="none" stroke-linecap="round">
    <use href="#flow1" stroke="#e7b98c" stroke-width="2.4"/>
    <use href="#flow2" stroke="#e7b98c" stroke-width="2.4"/>
    <use href="#flow3" stroke="#e7b98c" stroke-width="2.4"/>
    <use href="#flow1" stroke="#c9553a" stroke-width="1.4" stroke-dasharray="4 3">
      <animate attributeName="stroke-dashoffset" from="14" to="0" dur="1s" repeatCount="indefinite"/>
    </use>
    <use href="#flow2" stroke="#c9553a" stroke-width="1.4" stroke-dasharray="4 3">
      <animate attributeName="stroke-dashoffset" from="14" to="0" dur="1s" repeatCount="indefinite"/>
    </use>
    <use href="#flow3" stroke="#c9553a" stroke-width="1.4" stroke-dasharray="4 3">
      <animate attributeName="stroke-dashoffset" from="14" to="0" dur="1s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- data particles -->
  <circle r="3.2" fill="#d39a2b">
    <animateMotion dur="2.4s" begin="0s" repeatCount="indefinite"><mpath href="#flow1"/></animateMotion>
  </circle>
  <circle r="3.2" fill="#c8442a">
    <animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite"><mpath href="#flow2"/></animateMotion>
  </circle>
  <circle r="3.2" fill="#1d8a4f">
    <animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite"><mpath href="#flow3"/></animateMotion>
  </circle>

  <!-- approval hub -->
  <g transform="translate(259.3 159.5)">
    <circle r="34" fill="none" stroke="#e2c27e" stroke-width="1.2" opacity="0">
      <animate attributeName="r" values="34;52" dur="2.4s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;0" dur="2.4s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle r="34" fill="none" stroke="#e2c27e" stroke-width="1.2" opacity="0">
      <animate attributeName="r" values="34;52" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="46" fill="#e9cf9c" fill-opacity=".25" stroke="#e2c895" stroke-width="1"/>
    <circle r="42" fill="none" stroke="#e4c99a" stroke-width="1"/>
    <circle r="38.5" fill="none" stroke="#8f8579" stroke-width="1.1" stroke-dasharray="4 3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle r="32" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="3.2"/>
    <text y="-4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="7.6" font-weight="800" fill="#ffffff" letter-spacing=".2">APPROVED</text>
    <path d="M-9 6 L-3 12 L10 -1" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- left data cards -->
  <g font-family="Arial, Helvetica, sans-serif">
    <!-- FASTAG -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="4s" begin="0s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
      <rect x="20" y="58" width="136" height="47" rx="8" fill="#ffffff" filter="url(#cardShadow)"/>
      <circle cx="39.5" cy="82" r="13" fill="#f3e6d3"/>
      <path d="M31 88 L31 81 L35 77 L44 77 L48 81 L48 88 Z" fill="#d39a2b"/>
      <path d="M33.5 86.5 L38 80.5 L41 84 L43 82 L46 86.5 Z" fill="#f3e6d3"/>
      <text x="62" y="77" font-size="8.2" font-weight="700" fill="#5b6170" letter-spacing=".6">FASTAG DATA</text>
      <text x="62" y="92" font-size="10" font-weight="800" fill="#111318">26 active days</text>
      <circle cx="145.3" cy="66.3" r="3.6" fill="#8fc9a3">
        <animate attributeName="opacity" values="1;.3;1" dur="1.6s" begin="0s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- GPS -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="4s" begin="0.6s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
      <rect x="20" y="136" width="136" height="47" rx="8" fill="#ffffff" filter="url(#cardShadow)"/>
      <circle cx="39.5" cy="159.5" r="13" fill="#f6dcdc"/>
      <line x1="39.5" y1="157" x2="39.5" y2="168" stroke="#b9473f" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="39.5" cy="154" r="5" fill="#e0596b"/>
      <circle cx="38" cy="152.6" r="1.5" fill="#f6b8bf"/>
      <text x="62" y="155.7" font-size="8.2" font-weight="700" fill="#5b6170" letter-spacing=".6">GPS UPTIME</text>
      <text x="62" y="171.4" font-size="10" font-weight="800" fill="#111318">98.4% coverage</text>
      <circle cx="145.3" cy="145.3" r="3.6" fill="#7fc196">
        <animate attributeName="opacity" values="1;.3;1" dur="1.6s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- FUEL CARD -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="4s" begin="1.2s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
      <rect x="20" y="210" width="136" height="47" rx="8" fill="#ffffff" filter="url(#cardShadow)"/>
      <circle cx="39.5" cy="234" r="13" fill="#d9efe2"/>
      <rect x="34" y="226" width="9" height="14" rx="1.5" fill="#d0485a"/>
      <rect x="35.6" y="228" width="5.8" height="4" rx=".8" fill="#f6dcdc"/>
      <path d="M43 229 L45.5 231 L45.5 238" fill="none" stroke="#d0485a" stroke-width="1.3" stroke-linecap="round"/>
      <rect x="33" y="239.5" width="11" height="1.6" fill="#a8323f"/>
      <text x="62" y="229.5" font-size="8.2" font-weight="700" fill="#5b6170" letter-spacing=".6">FUEL CARD</text>
      <text x="62" y="245" font-size="10" font-weight="800" fill="#111318">₹1.2L / month</text>
      <circle cx="145.3" cy="219" r="3.6" fill="#4fa772">
        <animate attributeName="opacity" values="1;.3;1" dur="1.6s" begin="1s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 8-MIN DECISION ribbon -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="346.5" y="30.5" width="141" height="23" rx="11.5" fill="#111827"/>
    <circle cx="360" cy="42" r="3" fill="#2f8a55">
      <animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="421" y="45.6" text-anchor="middle" font-size="9.4" font-weight="800" fill="#ffffff" letter-spacing="1">8-MIN DECISION</text>
  </g>

  <!-- outcome cards -->
  <g font-family="Arial, Helvetica, sans-serif">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="4.5s" begin="0.3s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
      <rect x="330" y="58" width="157" height="66" rx="8" fill="#ffffff" filter="url(#cardShadow)"/>
      <path d="M334 58 L330 58 L330 124 L334 124 Z" fill="#c8442a"/>
      <text x="344" y="76" font-size="8.4" font-weight="700" fill="#5b6170" letter-spacing=".9">LOAN APPROVED</text>
      <text x="344" y="102" font-size="21.5" font-weight="800" fill="#111318">₹4,50,000</text>
      <text x="344" y="116" font-size="7.4" font-weight="700" fill="#4b5563">Working capital · 8 min</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="4.5s" begin="1.5s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
      <rect x="330" y="209" width="157" height="66" rx="8" fill="#ffffff" filter="url(#cardShadow)"/>
      <path d="M334 209 L330 209 L330 275 L334 275 Z" fill="#1d8a4f"/>
      <text x="344" y="226" font-size="8.4" font-weight="700" fill="#5b6170" letter-spacing=".9">INSURANCE PREMIUM</text>
      <text x="344" y="251.5" font-size="21.5" font-weight="800" fill="#111318">-18%</text>
      <text x="344" y="265.5" font-size="7.4" font-weight="700" fill="#4b5563">Behaviour-based · GPS + dashcam</text>
    </g>
  </g>

  <!-- TruckScore gauge at bottom -->
  <g transform="translate(60 320)" font-family="Arial, Helvetica, sans-serif">
    <text x="0" y="0" font-size="8.2" font-weight="700" fill="#5b6170" letter-spacing="1.6">TRUCKSCORE</text>
    <!-- track -->
    <rect x="0" y="10" width="380" height="10" rx="5" fill="#d8c0a3" fill-opacity=".75"/>
    <!-- halo: static, behind the fill -->
    <rect x="-2" y="6" width="302" height="18" rx="9" fill="url(#gaugeHaloGrad)" opacity=".7" filter="url(#gaugeHaloBlur)"/>
    <rect x="0" y="7.4" width="298" height="15.2" rx="7.6" fill="url(#gaugeHaloGrad)" opacity=".85" filter="url(#gaugeEdgeGlow)"/>
    <!-- fill: static at 298 / 380 (~78%) -->
    <rect x="0" y="10" width="298" height="10" rx="5" fill="url(#gaugeGrad)"/>
    <!-- score: static, centred over the end of the fill -->
    <text x="298" y="2" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">782</text>
    <text x="0" y="43" font-size="8.2" font-weight="700" fill="#8a93a6">POOR</text>
    <text x="380" y="43" text-anchor="end" font-size="8.2" font-weight="700" fill="#8a93a6">PRIME</text>
  </g>
</svg>
