<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" role="img" aria-label="Truck Duniya growth: trip data unlocks financing and cheaper insurance">
  <defs>
    <linearGradient id="bgLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf7ec"/>
      <stop offset="0.55" stop-color="#f5edda"/>
      <stop offset="1" stop-color="#eee1c1"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="rgba(199,145,44,0.28)"/>
      <stop offset="1" stop-color="rgba(199,145,44,0)"/>
    </radialGradient>
    <radialGradient id="glowRed" cx="0.85" cy="0.85" r="0.5">
      <stop offset="0" stop-color="rgba(192,67,39,0.16)"/>
      <stop offset="1" stop-color="rgba(192,67,39,0)"/>
    </radialGradient>
    <linearGradient id="gaugeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e34a26"/>
      <stop offset="0.55" stop-color="#c7912c"/>
      <stop offset="1" stop-color="#1b8a4a"/>
    </linearGradient>
    <linearGradient id="stampGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22a259"/>
      <stop offset="1" stop-color="#0f6a3a"/>
    </linearGradient>
    <pattern id="dotsLight" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.85" fill="rgba(15,23,37,0.06)"/>
    </pattern>
    <filter id="softShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="4" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="400" fill="url(#bgLight)"/>
  <rect width="500" height="400" fill="url(#dotsLight)"/>
  <rect width="500" height="400" fill="url(#glowGold)"/>
  <rect width="500" height="400" fill="url(#glowRed)"/>

  <!-- Data flow paths (curved arrows from left cards to central hub) -->
  <g fill="none" stroke="#c04327" stroke-width="1.8" stroke-linecap="round" opacity="0.55">
    <path id="flow1" d="M 154 84 Q 200 90 240 160"/>
    <path id="flow2" d="M 154 160 Q 200 160 250 160"/>
    <path id="flow3" d="M 154 236 Q 200 230 240 160"/>
  </g>
  <g stroke="#c04327" stroke-width="1.8" stroke-linecap="round" opacity="0.7" fill="none" stroke-dasharray="4 5">
    <path d="M 154 84 Q 200 90 240 160">
      <animate attributeName="stroke-dashoffset" from="9" to="0" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 154 160 Q 200 160 250 160">
      <animate attributeName="stroke-dashoffset" from="9" to="0" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 154 236 Q 200 230 240 160">
      <animate attributeName="stroke-dashoffset" from="9" to="0" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- Particles moving along flow paths -->
  <circle r="4" fill="#c7912c">
    <animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#flow1"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#c04327">
    <animateMotion dur="2.6s" repeatCount="indefinite" begin="-0.6s"><mpath href="#flow2"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.6s" repeatCount="indefinite" begin="-0.6s"/>
  </circle>
  <circle r="4" fill="#1b8a4a">
    <animateMotion dur="2.8s" repeatCount="indefinite" begin="-1.2s"><mpath href="#flow3"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.8s" repeatCount="indefinite" begin="-1.2s"/>
  </circle>

  <!-- Left column: three data-source cards -->
  <!-- FASTag -->
  <g transform="translate(20 60)" filter="url(#softShadow2)">
    <animateTransform attributeName="transform" type="translate" values="20 60; 20 56; 20 60" dur="3.2s" repeatCount="indefinite"/>
    <rect x="0" y="0" width="136" height="48" rx="10" fill="#fff"/>
    <circle cx="20" cy="24" r="14" fill="rgba(199,145,44,0.18)"/>
    <text x="20" y="30" text-anchor="middle" font-family="Inter" font-size="16" font-weight="900" fill="#c7912c">🛣</text>
    <text x="42" y="20" font-family="Inter, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.8" fill="#5a6373" textLength="69" lengthAdjust="spacingAndGlyphs">FASTAG DATA</text>
    <text x="42" y="36" font-family="Inter, sans-serif" font-size="10.5" font-weight="800" fill="#0f1725" textLength="71" lengthAdjust="spacingAndGlyphs">26 active days</text>
    <circle cx="126" cy="10" r="4" fill="#1b8a4a">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- GPS -->
  <g transform="translate(20 136)" filter="url(#softShadow2)">
    <animateTransform attributeName="transform" type="translate" values="20 136; 20 132; 20 136" dur="3.4s" repeatCount="indefinite" begin="-1s"/>
    <rect x="0" y="0" width="136" height="48" rx="10" fill="#fff"/>
    <circle cx="20" cy="24" r="14" fill="rgba(192,67,39,0.16)"/>
    <text x="20" y="30" text-anchor="middle" font-family="Inter" font-size="16" font-weight="900" fill="#c04327">📍</text>
    <text x="42" y="20" font-family="Inter, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.8" fill="#5a6373" textLength="60" lengthAdjust="spacingAndGlyphs">GPS UPTIME</text>
    <text x="42" y="36" font-family="Inter, sans-serif" font-size="10.5" font-weight="800" fill="#0f1725" textLength="79" lengthAdjust="spacingAndGlyphs">98.4% coverage</text>
    <circle cx="126" cy="10" r="4" fill="#1b8a4a">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.4s" repeatCount="indefinite" begin="-0.3s"/>
    </circle>
  </g>

  <!-- Fuel Card -->
  <g transform="translate(20 212)" filter="url(#softShadow2)">
    <animateTransform attributeName="transform" type="translate" values="20 212; 20 208; 20 212" dur="3.6s" repeatCount="indefinite" begin="-2s"/>
    <rect x="0" y="0" width="136" height="48" rx="10" fill="#fff"/>
    <circle cx="20" cy="24" r="14" fill="rgba(27,138,74,0.16)"/>
    <text x="20" y="30" text-anchor="middle" font-family="Inter" font-size="16" font-weight="900" fill="#1b8a4a">⛽</text>
    <text x="42" y="20" font-family="Inter, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.8" fill="#5a6373" textLength="56" lengthAdjust="spacingAndGlyphs">FUEL CARD</text>
    <text x="42" y="36" font-family="Inter, sans-serif" font-size="10.5" font-weight="800" fill="#0f1725" textLength="68" lengthAdjust="spacingAndGlyphs">₹1.2L / month</text>
    <circle cx="126" cy="10" r="4" fill="#1b8a4a">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite" begin="-0.6s"/>
    </circle>
  </g>

  <!-- Central approval hub with pulsing rings -->
  <g transform="translate(260 160)">
    <!-- Outer expanding rings -->
    <circle r="34" fill="none" stroke="#c7912c" stroke-width="1.5" opacity="0.45">
      <animate attributeName="r" values="34;58;34" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0;0.55" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="34" fill="none" stroke="#c7912c" stroke-width="1.5" opacity="0.45">
      <animate attributeName="r" values="34;58;34" dur="2.4s" repeatCount="indefinite" begin="-1.2s"/>
      <animate attributeName="opacity" values="0.55;0;0.55" dur="2.4s" repeatCount="indefinite" begin="-1.2s"/>
    </circle>
    <!-- Rotating dashed ring -->
    <circle r="42" fill="none" stroke="rgba(15,23,37,0.35)" stroke-width="1.2" stroke-dasharray="4 6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </circle>
    <!-- Solid stamp circle -->
    <circle r="34" fill="url(#stampGrad)" stroke="#fff" stroke-width="3" filter="url(#softShadow2)"/>
    <text y="-4" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" font-weight="900" fill="#fff" letter-spacing="0.6" textLength="46" lengthAdjust="spacingAndGlyphs">APPROVED</text>
    <path d="M -10 6 L -3 13 L 12 -3" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right side: Loan amount card -->
  <g transform="translate(330 62)" filter="url(#softShadow2)">
    <animateTransform attributeName="transform" type="translate" values="330 62; 330 58; 330 62" dur="3.2s" repeatCount="indefinite" begin="-0.4s"/>
    <rect x="0" y="0" width="158" height="66" rx="12" fill="#fff"/>
    <rect x="0" y="0" width="4" height="66" fill="#c04327"/>
    <text x="14" y="18" font-family="Inter, sans-serif" font-size="9" font-weight="700" letter-spacing="1.2" fill="#5a6373" textLength="93" lengthAdjust="spacingAndGlyphs">LOAN APPROVED</text>
    <text x="14" y="42" font-family="Inter, sans-serif" font-size="22" font-weight="900" fill="#0f1725" textLength="98" lengthAdjust="spacingAndGlyphs">₹4,50,000</text>
    <text x="14" y="58" font-family="Inter, sans-serif" font-size="8.5" font-weight="600" fill="#5a6373" textLength="93" lengthAdjust="spacingAndGlyphs">Working capital · 8 min</text>
  </g>

  <!-- Right side: Insurance discount card -->
  <g transform="translate(330 210)" filter="url(#softShadow2)">
    <animateTransform attributeName="transform" type="translate" values="330 210; 330 206; 330 210" dur="3.4s" repeatCount="indefinite" begin="-1.6s"/>
    <rect x="0" y="0" width="158" height="66" rx="12" fill="#fff"/>
    <rect x="0" y="0" width="4" height="66" fill="#1b8a4a"/>
    <text x="14" y="18" font-family="Inter, sans-serif" font-size="9" font-weight="700" letter-spacing="1.2" fill="#5a6373" textLength="118" lengthAdjust="spacingAndGlyphs">INSURANCE PREMIUM</text>
    <text x="14" y="42" font-family="Inter, sans-serif" font-size="22" font-weight="900" fill="#0f1725">-18%</text>
    <text x="14" y="58" font-family="Inter, sans-serif" font-size="8.5" font-weight="600" fill="#5a6373" textLength="134" lengthAdjust="spacingAndGlyphs">Behaviour-based · GPS + dashcam</text>
  </g>

  <!-- TruckScore gauge at bottom -->
  <g transform="translate(60 320)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="#5a6373">TRUCKSCORE</text>
    <!-- Gauge track -->
    <rect x="0" y="10" width="380" height="10" rx="5" fill="rgba(15,23,37,0.08)"/>
    <!-- Gauge fill -->
    <rect x="0" y="10" width="0" height="10" rx="5" fill="url(#gaugeGrad)">
      <animate attributeName="width" from="0" to="298" dur="2.2s" fill="freeze" begin="0.2s" calcMode="spline" keySplines="0.2 0.7 0.2 1"/>
    </rect>
    <!-- Score marker -->
    <g transform="translate(298 15)">
      <animateTransform attributeName="transform" type="translate" from="0 15" to="298 15" dur="2.2s" fill="freeze" begin="0.2s" calcMode="spline" keySplines="0.2 0.7 0.2 1"/>
      <circle r="8" fill="#fff" stroke="#0f1725" stroke-width="1.5"/>
      <text y="-14" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="900" fill="#0f1725">782</text>
    </g>
    <text x="0" y="42" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#8a94a3">POOR</text>
    <text x="380" y="42" text-anchor="end" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#8a94a3">PRIME</text>
  </g>

  <!-- Top ribbon: 8-MIN DECISION -->
  <g transform="translate(346 30)">
    <rect x="0" y="0" width="142" height="24" rx="12" fill="#0f1725"/>
    <circle cx="14" cy="12" r="3" fill="#6dd18d">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="79" y="16" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" font-weight="900" letter-spacing="1.2" fill="#fff" textLength="90" lengthAdjust="spacingAndGlyphs">8-MIN DECISION</text>
  </g>
</svg>
