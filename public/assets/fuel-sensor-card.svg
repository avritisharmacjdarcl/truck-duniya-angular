 <linearGradient id="cardG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262b33" stop-opacity=".94"/><stop offset="1" stop-color="#1a1e24" stop-opacity=".94"/></linearGradient>
