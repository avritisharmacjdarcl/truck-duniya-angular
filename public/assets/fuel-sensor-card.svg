 <radialGradient id="rust" cx=".95" cy="1" r=".7"><stop offset="0" stop-color="#C84B2C" stop-opacity=".55"/><stop offset=".5" stop-color="#C84B2C" stop-opacity=".14"/><stop offset="1" stop-color="#C84B2C" stop-opacity="0"/></radialGradient>
 <radialGradient id="spot" cx=".33" cy=".55" r=".45"><stop offset="0" stop-color="#e98a4a" stop-opacity=".16"/><stop offset="1" stop-color="#e98a4a" stop-opacity="0"/></radialGradient>
