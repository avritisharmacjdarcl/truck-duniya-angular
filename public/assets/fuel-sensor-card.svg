 <linearGradient id="tankEnd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".45"/><stop offset=".18" stop-color="#000" stop-opacity="0"/><stop offset=".85" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".5"/></linearGradient>
 <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a4048"/><stop offset=".5" stop-color="#262a30"/><stop offset="1" stop-color="#16191d"/></linearGradient>
 <linearGradient id="fuel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0a23a" stop-opacity=".9"/><stop offset="1" stop-color="#9a3a1c" stop-opacity=".95"/></linearGradient>
 <linearGradient id="gauge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C84B2C"/><stop offset="1" stop-color="#f0a23a"/></linearGradient>
